<style>
/* Layout: one-column phone app (max 560px) — sticky top bar, stacked cards, fixed bottom tab bar; games take the full column. */
:root{
--bg:#FBF2F1;--bg-bloom1:#F9DCE6;--bg-bloom2:#E9E0F7;--bg-bloom3:#FDE5D8;
--surface:#FFFCFB;--surface2:#F7ECEF;--line:#EBDAE1;--ink:#2C1A2E;--muted:#7D6779;
--rose:#D9577E;--rose-soft:#F9DCE5;--plum:#6E4FA3;--plum-soft:#EAE2F6;--peach:#EE9467;--peach-soft:#FCE6DA;--gold:#E2B04A;
--good:#2C9A6B;--bad:#C4475B;--on-accent:#FFFFFF;
--w1:#F9D3DF;--w2:#E4D9F5;--w3:#FCDCCB;--w4:#FBEFD9;
--shadow:0 1px 2px rgb(70 25 60/.05),0 10px 28px -8px rgb(120 45 90/.16);
--shadow-lg:0 24px 60px -18px rgb(90 30 70/.35);
--f-display:"Marhey","Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
--f-body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
--r-lg:26px;--r-md:18px;--r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#160E1A;--bg-bloom1:#3A1A30;--bg-bloom2:#251C3E;--bg-bloom3:#3A2219;
--surface:#211726;--surface2:#2B1F32;--line:#3B2C44;--ink:#F7E9EF;--muted:#B8A1B5;
--rose:#F27EA1;--rose-soft:#4A2337;--plum:#B597E8;--plum-soft:#33264D;--peach:#F4A982;--peach-soft:#47291D;--gold:#EEC064;
--good:#5DCB9A;--bad:#F07A8C;--on-accent:#1C0F1A;
--w1:#5A2A44;--w2:#3D2F5E;--w3:#5A3524;--w4:#4A3F2A;
--shadow:0 1px 2px rgb(0 0 0/.3),0 10px 28px -10px rgb(0 0 0/.6);--shadow-lg:0 24px 60px -18px rgb(0 0 0/.75);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#160E1A;--bg-bloom1:#3A1A30;--bg-bloom2:#251C3E;--bg-bloom3:#3A2219;
--surface:#211726;--surface2:#2B1F32;--line:#3B2C44;--ink:#F7E9EF;--muted:#B8A1B5;
--rose:#F27EA1;--rose-soft:#4A2337;--plum:#B597E8;--plum-soft:#33264D;--peach:#F4A982;--peach-soft:#47291D;--gold:#EEC064;
--good:#5DCB9A;--bad:#F07A8C;--on-accent:#1C0F1A;
--w1:#5A2A44;--w2:#3D2F5E;--w3:#5A3524;--w4:#4A3F2A;
--shadow:0 1px 2px rgb(0 0 0/.3),0 10px 28px -10px rgb(0 0 0/.6);--shadow-lg:0 24px 60px -18px rgb(0 0 0/.75);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
 background-image:radial-gradient(60vmax 40vmax at 100% -5%,var(--bg-bloom1),transparent 60%),radial-gradient(50vmax 40vmax at -10% 30%,var(--bg-bloom2),transparent 60%),radial-gradient(50vmax 35vmax at 80% 110%,var(--bg-bloom3),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--plum);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.center{text-align:center;justify-content:center}
.ic{width:22px;height:22px;flex:none}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
[dir=rtl] .ic.flip{transform:scaleX(-1)}
[dir=ltr] .ic.flip.rev{transform:scaleX(-1)}
[dir=rtl] .ic.flip.rev{transform:none}

#app{max-width:560px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:16px;padding-top:8px}
#view>*{min-width:0}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--rose);letter-spacing:0}
.tb-r{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;color:var(--ink);transition:background .2s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;color:var(--muted)}
.icon-btn.sm .ic{width:18px;height:18px}
.badge{position:absolute;top:4px;inset-inline-end:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:var(--on-accent);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.badge.dotb{min-width:9px;width:9px;height:9px;padding:0;top:8px;inset-inline-end:calc(50% - 18px)}
.ponline{display:inline-flex;margin-inline-end:4px;opacity:.55;transition:opacity .3s}
.ponline.on{opacity:1}

/* bottom nav */
#nav{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:space-around;gap:2px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:color-mix(in oklab,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav[hidden],#top[hidden]{display:none!important}
.nb{position:relative;flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:500;transition:color .2s,background .2s}
.nb.on{color:var(--rose);background:var(--rose-soft)}
.nb .ic{width:23px;height:23px}

/* avatars */
.av{--s:48px;position:relative;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--c);color:#fff;box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--c);overflow:visible}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av b{font-family:var(--f-display);font-size:calc(var(--s)*.42);line-height:1}
.av.big{box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--c),var(--shadow)}
.av.ghost{background:var(--surface2);color:var(--muted);box-shadow:0 0 0 2px var(--line);border:2px dashed var(--line)}
.av .dot{position:absolute;bottom:0;inset-inline-end:0;width:28%;height:28%;min-width:9px;min-height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--surface)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h3{font-size:16px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.row.end{justify-content:flex-end}
.inline{display:flex;gap:8px;align-items:stretch}
.inline>input,.inline>select{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--surface2);color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--line);transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--rose),color-mix(in oklab,var(--rose) 60%,var(--plum)));color:var(--on-accent);border-color:transparent;box-shadow:0 8px 20px -8px color-mix(in oklab,var(--rose) 70%,transparent)}
.btn.danger{background:var(--bad);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{min-height:54px;padding:0 26px;font-size:16px;border-radius:18px}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.wa{background:#25D366;color:#0B2B17;border-color:transparent}
.link{color:var(--plum);font-weight:600;font-size:13.5px}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);outline:none;transition:border-color .2s,background .2s}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{border-color:var(--rose);background:var(--surface)}
input:disabled{opacity:.5}
.w80{max-width:90px;flex:none!important}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.note{padding:12px 14px;border-radius:var(--r-md);background:var(--plum-soft);color:var(--ink);font-size:13.5px}
.note.warn{background:var(--peach-soft)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.vh{display:flex;flex-direction:column;gap:2px;position:relative}
.vh:has(.icon-btn){flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
.vh h2{font-family:var(--f-display);font-size:26px;font-weight:700}
.vh p{color:var(--muted);font-size:13.5px;width:100%}
.sec-h{display:flex;align-items:center;justify-content:space-between}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.ok{background:color-mix(in oklab,var(--good) 18%,transparent);color:var(--good)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar.sm{height:6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--rose),var(--plum));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.loader{width:36px;height:36px;border-radius:50%;border:3px solid var(--rose-soft);border-top-color:var(--rose);animation:spin 1s linear infinite;margin:18px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* welcome */
.welcome,.empty-hero{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 4px 10px}
.logo-big{font-family:var(--f-display);font-size:clamp(40px,12vw,58px);font-weight:700;line-height:1.05;background:linear-gradient(120deg,var(--rose),var(--plum) 60%,var(--peach));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{max-width:40ch;color:var(--muted);font-size:15.5px}
.orbit{position:relative;width:120px;height:120px;margin-bottom:-8px}
.orbit span{position:absolute;border-radius:50%}
.o1{inset:20px;background:radial-gradient(circle at 35% 30%,var(--peach),var(--rose));box-shadow:var(--shadow-lg)}
.o2{width:22px;height:22px;background:var(--plum);top:0;inset-inline-start:50%;animation:orb 7s linear infinite;transform-origin:0 60px}
.o3{width:14px;height:14px;background:var(--gold);bottom:6px;inset-inline-start:8px;animation:orb 9s linear infinite reverse;transform-origin:52px -46px}
@keyframes orb{to{transform:rotate(360deg)}}
.choice{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:8px}
.choice-b{display:flex;align-items:center;gap:14px;text-align:start;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.choice-b.primary{border:1.5px solid color-mix(in oklab,var(--rose) 50%,var(--line))}
.choice-b.ghost{background:transparent;box-shadow:none;border-style:dashed}
.choice-b b{display:block;font-size:16px}
.choice-b small{color:var(--muted);font-size:13px}
.cb-ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);flex:none}
.setup h2{font-family:var(--f-display);font-size:24px}
.setup>.icon-btn{align-self:flex-start;margin:-6px}
.pf{display:flex;gap:16px;align-items:flex-start}
.pf-av{--c:var(--rose);flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--c);cursor:pointer;overflow:hidden;color:var(--muted)}
.pf-av img{width:100%;height:100%;object-fit:cover}
.pf-av span{display:flex;flex-direction:column;align-items:center;font-size:12px}
.pf-f{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--surface);transition:transform .2s,box-shadow .2s}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--c);transform:scale(1.06)}
.invite p{color:var(--muted);font-size:13.5px}
code.sel{display:block;user-select:all;-webkit-user-select:all;font-size:12px;padding:8px 10px;border-radius:10px;background:var(--surface2);overflow-wrap:anywhere;direction:ltr;text-align:left}

/* home */
.couple{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px 4px;padding:22px 14px 16px;border-radius:32px;background:linear-gradient(160deg,color-mix(in oklab,var(--surface) 85%,var(--rose-soft)),var(--surface));border:1px solid var(--line);box-shadow:var(--shadow)}
.couple.slim{grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px}
.cp{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.cp b{font-family:var(--f-display);font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in oklab,var(--c) 18%,transparent);color:color-mix(in oklab,var(--c) 75%,var(--ink))}
.thread{position:relative;width:min(120px,24vw);color:var(--rose);align-self:center;margin-bottom:34px}
.thread svg{width:100%;display:block}
.thread .heart{position:absolute;inset:0;display:grid;place-items:center;top:-10px}
.thread .heart .ic{width:22px;height:22px;fill:var(--rose);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
.love{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.love.grow{grid-column:auto}
.love-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600}
.love-h small{color:var(--muted);font-weight:400;margin-inline-start:4px}
.resume{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);text-align:start;background:linear-gradient(135deg,var(--plum),color-mix(in oklab,var(--plum) 55%,var(--rose)));color:var(--on-accent);box-shadow:var(--shadow);animation:glow 2.6s ease-in-out infinite}
.resume>span:nth-child(2){flex:1}
.resume b{display:block}
.resume small{opacity:.85}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in oklab,var(--plum) 18%,transparent),var(--shadow)}}
.gico{font-size:22px;line-height:1}
.resume .gico{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgb(255 255 255/.18)}
.cmp{gap:10px}
.cmp-h{display:grid;grid-template-columns:1fr 1fr 1fr;font-weight:700;font-size:13px}
.cmp-h span:first-child{color:var(--c);text-align:start}.cmp-h span:last-child{color:var(--c);text-align:end}
.cmp-h span{color:color-mix(in oklab,var(--c) 80%,var(--ink))!important}
.cmp-r{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px}
.cmp-r>b{font-size:18px;font-weight:700}
.cmp-r>b:last-child{text-align:end}
.cmp-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.cmp-mid small{font-size:11px;color:var(--muted);letter-spacing:.04em;font-weight:600}
.dual{display:flex;width:100%;height:6px;border-radius:9px;overflow:hidden;background:var(--surface2);gap:2px}
.dual i{display:block;height:100%;transition:width .8s}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qb{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;text-align:center;line-height:1.3;transition:transform .15s}
.qb:active{transform:scale(.96)}
.qi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose)}
.qb:nth-child(4n+2) .qi{background:var(--plum-soft);color:var(--plum)}
.qb:nth-child(4n+3) .qi{background:var(--peach-soft);color:color-mix(in oklab,var(--peach) 70%,var(--ink))}
.qb:nth-child(4n) .qi{background:color-mix(in oklab,var(--gold) 22%,transparent);color:color-mix(in oklab,var(--gold) 60%,var(--ink))}
.qb .badge{top:6px;inset-inline-end:10px}
.daily{display:grid;grid-template-columns:1fr;gap:12px}
.daily .card h3{font-size:17px;font-family:var(--f-display);font-weight:600}
.dq{background:linear-gradient(170deg,color-mix(in oklab,var(--surface) 80%,var(--plum-soft)),var(--surface))}
.dc{background:linear-gradient(170deg,color-mix(in oklab,var(--surface) 80%,var(--peach-soft)),var(--surface))}
.dc .btn{align-self:flex-start}
.dq-ans{display:grid;gap:8px}
.dq-ans div{padding:10px 12px;border-radius:14px;background:color-mix(in oklab,var(--c) 12%,var(--surface));border-inline-start:3px solid var(--c)}
.dq-ans small{display:block;font-weight:700;color:color-mix(in oklab,var(--c) 70%,var(--ink));font-size:12px}
.pstate{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;justify-content:center}
.pstate.ok{color:var(--good);justify-content:flex-start}
.pstate .ic{width:16px;height:16px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;background:var(--surface2);font-size:17px}
.ht{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hrow small{color:var(--muted);font-size:11.5px;white-space:nowrap}

/* games list */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:start;transition:transform .2s,box-shadow .2s;min-width:0}
.gcard:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow)}
.gcard:disabled{opacity:.5}
.gcard b{font-size:15px;line-height:1.3}
.gcard small{color:var(--muted);font-size:12px;line-height:1.45;flex:1}
.gart{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:28px;background:linear-gradient(140deg,var(--rose-soft),var(--plum-soft))}
.gcard:nth-child(3n+2) .gart{background:linear-gradient(140deg,var(--peach-soft),var(--rose-soft))}
.gcard:nth-child(3n) .gart{background:linear-gradient(140deg,var(--plum-soft),var(--peach-soft))}
.gart.sm{width:44px;height:44px;font-size:24px;border-radius:14px}
.gtag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.gtag.sealed{background:var(--plum-soft);color:var(--plum)}
.gtag.coop{background:var(--rose-soft);color:var(--rose)}

/* game shell */
.game{display:flex;flex-direction:column;gap:16px}
.ghead{display:flex;align-items:center;gap:6px}
.gtitle{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px;font-weight:600;min-width:0}
.gmeta{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs-x{font-family:var(--f-display);color:var(--muted);font-size:14px;display:grid;place-items:center}
.vs-x .ic{fill:var(--rose);color:var(--rose)}
.pchip{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);min-width:0;transition:border-color .3s,box-shadow .3s}
.pchip:last-child{flex-direction:row-reverse;text-align:end}
.pchip.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in oklab,var(--c) 18%,transparent)}
.pchip-t{min-width:0}
.pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn small{color:var(--muted);font-weight:400}
.ps{font-family:var(--f-display);font-size:22px;line-height:1.1;color:color-mix(in oklab,var(--c) 75%,var(--ink))}
.turnpill{position:absolute;top:-9px;inset-inline-start:12px;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--c);color:#fff}
.pchip:last-child .turnpill{inset-inline-start:auto;inset-inline-end:12px}
.turnmsg{text-align:center;font-weight:600;color:var(--muted)}
.turnmsg.me{color:var(--rose);font-family:var(--f-display);font-size:20px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.05)}}
.prompt{text-align:center;font-weight:600;font-size:15.5px}
.waiting{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px dashed var(--line);text-align:center;color:var(--muted)}
.waiting p{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.lockd{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--plum);font-size:13px}
.lockd .ic{width:16px;height:16px}
.done{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;border-radius:30px;background:linear-gradient(160deg,var(--rose-soft),var(--plum-soft));text-align:center;animation:rise .6s cubic-bezier(.2,.9,.3,1.3)}
.done h2{font-family:var(--f-display);font-size:28px}
.trophy{font-size:56px;line-height:1;animation:bounce 1.4s ease-in-out infinite}
.aw{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--plum)}
@keyframes rise{from{transform:translateY(16px) scale(.96);opacity:0}}
@keyframes bounce{50%{transform:translateY(-6px)}}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.tbl th,.tbl td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2)}
.tbl tr.cur td{background:color-mix(in oklab,var(--rose-soft) 60%,transparent)}
.tbl b.win{color:var(--good)}
.pt{font-size:11px;color:var(--plum);margin-inline-start:4px}
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.log summary{cursor:pointer;font-weight:600;font-size:13.5px}
.log .tbl{margin-top:10px}
.logrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.lastres{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface2);font-size:13.5px;text-align:center}
.lastres.good{background:color-mix(in oklab,var(--good) 14%,var(--surface))}
.lastres.anim{animation:rise .5s ease}
.qcard{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:22px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.qcard h3{font-family:var(--f-display);font-size:21px;font-weight:600}
.qcard small{color:var(--muted)}
.qwho{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:color-mix(in oklab,var(--c) 75%,var(--ink))}
.diff{font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--surface2)}
.diff.d1{color:var(--good)}.diff.d2{color:var(--gold)}.diff.d3{color:var(--bad)}

/* RPS */
.rps-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rps-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 6px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);transition:transform .15s,border-color .2s}
.rps-btn span{font-size:46px;line-height:1.1;transition:transform .2s}
.rps-btn:hover span{transform:rotate(-10deg) scale(1.08)}
.rps-btn:active{transform:scale(.94);border-color:var(--rose)}
.rps-btn small{font-weight:600;color:var(--muted)}
.rps-reveal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.hand{display:flex;flex-direction:column;align-items:center;gap:4px}
.hand span{font-size:58px;line-height:1;filter:drop-shadow(0 6px 10px color-mix(in oklab,var(--c) 40%,transparent))}
.hand small{font-size:12px;font-weight:600;color:var(--muted)}
.rps-res{font-family:var(--f-display);font-size:15px;text-align:center;color:var(--rose);max-width:110px}
.rps-reveal.anim .hand span{animation:shake .9s ease-out}
.rps-reveal.anim .rps-res{animation:rise .5s .85s both}
.flipx span{transform:scaleX(-1)}
.rps-reveal.anim .flipx span{animation:shake2 .9s ease-out}
@keyframes shake{0%,30%,60%{transform:translateY(0) rotate(0)}15%,45%,75%{transform:translateY(-14px) rotate(-12deg)}100%{transform:none}}
@keyframes shake2{0%,30%,60%{transform:scaleX(-1) translateY(0)}15%,45%,75%{transform:scaleX(-1) translateY(-14px) rotate(-12deg)}100%{transform:scaleX(-1)}}

/* dice */
.dice-stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 10px 16px;border-radius:30px;background:radial-gradient(circle at 50% 40%,var(--surface),color-mix(in oklab,var(--surface2) 80%,var(--plum-soft)));border:1px solid var(--line)}
.dice-pair{display:flex;gap:34px;perspective:700px}
.die-wrap{width:74px;height:74px}
.tumble{width:100%;height:100%;transform-style:preserve-3d}
.tumble.roll{animation:tumble 1.1s cubic-bezier(.2,.7,.25,1)}
@keyframes tumble{0%{transform:translateY(-40px) rotateX(0) rotateY(0) rotateZ(0)}60%{transform:translateY(6px)}100%{transform:translateY(0) rotateX(720deg) rotateY(720deg) rotateZ(360deg)}}
.cube{position:relative;width:74px;height:74px;transform-style:preserve-3d;transition:transform .4s}
.face{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;border-radius:16px;background:linear-gradient(145deg,#FFFDFC,#F3E6EC);box-shadow:inset 0 0 0 1px rgb(120 60 90/.15),inset -4px -6px 10px rgb(150 80 110/.12)}
.face i{display:block;margin:auto;width:12px;height:12px;border-radius:50%}
.face i.pip{background:radial-gradient(circle at 35% 35%,#7A4C8F,#3A1D46)}
.f1 i.pip{background:radial-gradient(circle at 35% 35%,#F06D94,#B32D58);width:16px;height:16px}
.f1{transform:translateZ(37px)}.f6{transform:rotateY(180deg) translateZ(37px)}.f3{transform:rotateY(90deg) translateZ(37px)}.f4{transform:rotateY(-90deg) translateZ(37px)}.f2{transform:rotateX(90deg) translateZ(37px)}.f5{transform:rotateX(-90deg) translateZ(37px)}
.dice-who{color:var(--muted);font-weight:600}
.dice-who b{font-family:var(--f-display);font-size:24px;color:var(--rose)}

/* NAP */
.nap-top{display:flex;align-items:center;justify-content:center;gap:22px}
.nap-letter{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;font-family:var(--f-display);font-size:58px;background:linear-gradient(140deg,var(--rose),var(--plum));color:var(--on-accent);box-shadow:var(--shadow-lg)}
.nap-letter.pop{animation:popIn .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none}}
.nap-timer{--p:1;width:84px;height:84px;border-radius:50%;display:grid;place-content:center;text-align:center;background:conic-gradient(var(--rose) calc(var(--p)*360deg),var(--surface2) 0);position:relative}
.nap-timer::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.nap-timer>*{position:relative;line-height:1.1}
.nap-timer span{font-family:var(--f-display);font-size:26px}
.nap-timer small{font-size:11px;color:var(--muted)}
.nap-timer.low{animation:nudge .5s infinite}
.nap-timer.low span{color:var(--bad)}
.nap-timer.sm{width:64px;height:64px;align-self:center}
.nap-timer.sm span{font-size:20px}
.nap-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nap-form .fld:last-child{grid-column:1/-1}
.nap-review{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px}
.nr-h,.nr-row{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;align-items:center}
.nr-h{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.nr-c{font-size:12px;font-weight:700;color:var(--muted)}
.nr-a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:6px;border-radius:12px;background:var(--surface2);font-weight:600;text-align:center;font-size:14px;overflow-wrap:anywhere}
.nr-a.bad{opacity:.5;text-decoration:line-through}
.nr-a.flag{background:color-mix(in oklab,var(--bad) 16%,var(--surface));color:var(--bad)}
.nr-a em{font-style:normal;font-size:10px;font-weight:700}
.btnlike{border:1.5px dashed var(--line)}
.btnlike:not(:disabled):hover{border-color:var(--bad)}

/* XO / C4 / memory */
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,340px);margin:0 auto;aspect-ratio:1}
.xo-c{border-radius:22px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-size:clamp(40px,13vw,58px);font-weight:700;color:var(--c);transition:background .2s,transform .15s}
.xo-c:not(:disabled):hover{background:var(--surface2)}
.xo-c.on span{animation:popIn .4s cubic-bezier(.2,1.4,.4,1)}
.xo-c.win{background:color-mix(in oklab,var(--c) 18%,var(--surface));border-color:var(--c)}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;border-radius:24px;background:linear-gradient(160deg,var(--plum),color-mix(in oklab,var(--plum) 60%,var(--ink)));width:min(100%,420px);margin:0 auto;box-shadow:var(--shadow-lg)}
.c4-c{aspect-ratio:1;border-radius:50%;background:color-mix(in oklab,var(--bg) 85%,var(--plum));display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 3px 6px rgb(0 0 0/.25)}
.c4-c:not(:disabled):hover{background:color-mix(in oklab,var(--bg) 70%,var(--rose))}
.disc{display:block;width:88%;height:88%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in oklab,var(--c) 55%,white),var(--c) 60%);box-shadow:inset 0 -3px 0 rgb(0 0 0/.18)}
.disc.drop{animation:drop .45s cubic-bezier(.4,0,.6,1.4)}
.disc.win{animation:nudge .8s infinite;box-shadow:0 0 0 3px #fff}
@keyframes drop{from{transform:translateY(calc(-120% * (var(--r) + 1) - 30px))}}
.mem{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px;width:min(100%,440px);margin:0 auto}
.mem-c{aspect-ratio:3/4;position:relative;perspective:600px;border-radius:14px}
.mem-c .f{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.mem-c .b{background:linear-gradient(140deg,var(--rose),var(--plum));box-shadow:var(--shadow)}
.mem-c .b::after{content:"";width:40%;height:40%;border-radius:50%;border:2px solid rgb(255 255 255/.4)}
.mem-c .fr{background:var(--surface);border:1.5px solid var(--line);font-size:clamp(24px,8vw,34px);transform:rotateY(180deg)}
.mem-c.up .b{transform:rotateY(-180deg)}
.mem-c.up .fr{transform:rotateY(0)}
.mem-c.got .fr{border-color:var(--c);background:color-mix(in oklab,var(--c) 14%,var(--surface))}

/* KMB / trivia / wyr / more */
.kmb-rev{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kr{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r-md);background:color-mix(in oklab,var(--c) 12%,var(--surface));border:1.5px solid color-mix(in oklab,var(--c) 40%,var(--line));text-align:center}
.kr small{font-size:12px;color:var(--muted);font-weight:600}
.kr b{font-size:17px;overflow-wrap:anywhere}
.kmb-rev.anim .kr{animation:rise .5s ease both}.kmb-rev.anim .kr:last-child{animation-delay:.25s}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);text-align:start;font-weight:600;transition:border-color .2s,transform .15s}
.opt:not(:disabled):hover{border-color:var(--plum)}
.opt:active{transform:scale(.98)}
.opt b{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--plum-soft);color:var(--plum);font-family:var(--f-display)}
.wyr{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px}
.wyr-b{padding:24px 12px;border-radius:24px;font-family:var(--f-display);font-size:19px;background:linear-gradient(150deg,var(--rose-soft),var(--surface));border:1.5px solid color-mix(in oklab,var(--rose) 30%,var(--line));transition:transform .15s}
.wyr-b.alt{background:linear-gradient(150deg,var(--plum-soft),var(--surface));border-color:color-mix(in oklab,var(--plum) 30%,var(--line))}
.wyr-b:active{transform:scale(.96)}
.wyr-or{align-self:center;font-weight:700;color:var(--muted)}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-b{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 10px;border-radius:24px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;transition:transform .15s,border-color .2s}
.who-b:hover{border-color:var(--c)}
.who-b:active{transform:scale(.96)}

/* wheel */
.tabs{display:flex;gap:6px;padding:4px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.tab{flex:1;padding:9px 6px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.wheel-wrap{position:relative;width:min(100%,360px);aspect-ratio:1;margin:6px auto 0}
#wheelCv{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px var(--surface),0 0 0 10px var(--line),var(--shadow-lg);display:block}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--rose);z-index:2;filter:drop-shadow(0 3px 4px rgb(0 0 0/.25))}
.spin-b{position:absolute;inset:0;margin:auto;width:23%;height:23%;border-radius:50%;background:linear-gradient(140deg,var(--rose),var(--plum));color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:clamp(13px,4vw,17px);box-shadow:0 0 0 5px var(--surface),var(--shadow-lg);transition:transform .2s}
.spin-b:not(:disabled):hover{transform:scale(1.06)}
.spin-b:disabled{opacity:.75}
.wres{flex-direction:row;align-items:center;gap:14px}
.wres>div{flex:1;min-width:0}
.wres h3{font-family:var(--f-display);font-size:20px}
.wres small{color:var(--muted)}
.wres-ic{font-size:36px}
.wres.pop{animation:rise .5s cubic-bezier(.2,1.3,.4,1)}
.wcfg{display:flex;flex-direction:column}

/* deck */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.seg.wrap{margin:4px 0}
.segb{padding:7px 14px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);color:var(--ink);font-weight:600;font-size:13px}
.segb.on{border-color:var(--c,var(--rose));background:color-mix(in oklab,var(--c,var(--rose)) 15%,var(--surface))}
.bigcard{position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:22px;border-radius:30px;background:var(--surface);border:1.5px solid color-mix(in oklab,var(--c,var(--rose)) 45%,var(--line));box-shadow:var(--shadow-lg)}
.bigcard.flip-in{animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{transform:perspective(800px) rotateY(80deg) translateY(10px);opacity:0}}
.bigcard.back{align-items:center;justify-content:center;text-align:center;background:linear-gradient(140deg,var(--rose),var(--plum));border:0;color:var(--on-accent)}
.bigcard.back .pstate{color:var(--on-accent);opacity:.9;justify-content:center}
.deck-logo{font-family:var(--f-display);font-size:30px}
.bc-cat{font-size:12.5px;font-weight:700;color:var(--muted)}
.bc-t{font-family:var(--f-display);font-size:23px;line-height:1.5}
.bc-for{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:color-mix(in oklab,var(--c) 70%,var(--ink))}
.lib{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px 12px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.off .lt{opacity:.45;text-decoration:line-through}
.lt{flex:1;min-width:0;font-size:14px}
.lcat{font-size:18px}
.tagc{font-style:normal;font-size:10.5px;font-weight:700;color:var(--plum);background:var(--plum-soft);padding:1px 7px;border-radius:99px}
.tog{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.tog i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0/.25);transition:inset-inline-start .25s}
.tog.on{background:var(--rose)}
.tog.on i{inset-inline-start:21px}

/* shop */
.wallet{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px;border-radius:var(--r-lg);background:linear-gradient(135deg,color-mix(in oklab,var(--gold) 30%,var(--surface)),var(--peach-soft));border:1px solid var(--line)}
.coinbig{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#4A3108}
.coinbig .ic{width:30px;height:30px}
.wallet small{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.wallet b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.wallet-n{font-size:12.5px;color:var(--muted);flex-basis:100%}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sitem{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.sitem b{font-size:14px;line-height:1.35;flex:1}
.sic{font-size:28px}
.cost{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:color-mix(in oklab,var(--gold) 55%,var(--ink))}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow.done{opacity:.6}
.vic{font-size:22px}
.vt{flex:1;min-width:0;font-size:14px;font-weight:600}
.vt small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}

/* us */
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:start;font-weight:600}
.mrow:last-child{border-bottom:0}
.mrow>span:nth-child(2){flex:1}
.mrow small{color:var(--muted);font-weight:600}
.mrow>.ic{color:var(--muted);width:18px;height:18px}
.filebtn{cursor:pointer}
.mm-prev{border-radius:var(--r-md);max-height:220px;object-fit:cover;width:100%}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mcard{position:relative;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.mcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.mc-b{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mc-b small{color:var(--muted);font-size:11.5px}
.mc-b h4{font-size:15px}
.mc-b p{font-size:13px;color:var(--muted)}
.mdel{position:absolute;top:6px;inset-inline-end:6px;background:color-mix(in oklab,var(--surface) 80%,transparent)}
.wlist{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.wrow>span{flex:1;min-width:0;font-weight:600}
.wrow small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.wrow.done>span{text-decoration:line-through;opacity:.6}
.cbx{width:30px;height:30px;flex:none;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-accent)}
.cbx.on{background:var(--good);border-color:var(--good)}
.cbx .ic{width:18px;height:18px}
.hsum{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:6px 0}
.hsum b{font-weight:700}
.hsum span{grid-column:2;font-size:12.5px;color:var(--muted)}
.hsum .bar{grid-column:1/-1}
.hsum .av{grid-row:span 2}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ach{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:center;filter:grayscale(1);opacity:.6}
.ach.got{filter:none;opacity:1;border-color:color-mix(in oklab,var(--gold) 50%,var(--line));background:linear-gradient(170deg,color-mix(in oklab,var(--gold) 14%,var(--surface)),var(--surface))}
.ach-ic{font-size:34px}
.ach b{font-size:13.5px}
.ach-who{display:flex;gap:8px;min-height:24px;align-items:center}
.ach-who small{color:var(--muted)}

/* sheet / modal / toast */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgb(20 8 20/.35)}
.sheet-in{width:min(560px,100%);height:min(78vh,640px);display:flex;flex-direction:column;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);padding:12px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:sheetUp .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(40%);opacity:.4}}
.sh-h{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sh-h b{flex:1}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 2px}
.msg{max-width:80%;align-self:flex-start;padding:9px 13px;border-radius:18px 18px 18px 6px;background:var(--surface2)}
.msg.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:color-mix(in oklab,var(--c) 22%,var(--surface))}
[dir=rtl] .msg{border-radius:18px 18px 6px 18px}[dir=rtl] .msg.me{border-radius:18px 18px 18px 6px}
.msg p{overflow-wrap:anywhere}
.msg small{font-size:10.5px;color:var(--muted)}
.reacts{display:flex;gap:4px;justify-content:space-between;padding:6px 0}
.reacts button{font-size:24px;padding:4px;border-radius:12px;transition:transform .15s}
.reacts button:active{transform:scale(1.3)}
.chat-f{display:flex;gap:8px}
.chat-f input{flex:1;min-width:0}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.mbg{position:absolute;inset:0;background:rgb(20 8 20/.42);backdrop-filter:blur(3px)}
.mbox{position:relative;width:min(480px,100%);max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow-lg);animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
.mbox h3{font-family:var(--f-display);font-size:21px}
.mbox h4{font-size:14px;color:var(--muted)}
.mh{display:flex;align-items:center;gap:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:600;font-size:14px}
.setrow .inline{max-width:200px}
#toast{position:fixed;z-index:70;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:min(92vw,480px);padding:11px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbtn{flex:none;padding:6px 12px;border-radius:10px;background:var(--rose);color:var(--on-accent);font-weight:700;font-size:12.5px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.floater{position:absolute;bottom:90px;font-size:40px;animation:floatUp 2.6s ease-out forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-60vh) scale(1) rotate(-12deg);opacity:0}}

@media (min-width:520px){.daily{grid-template-columns:1fr 1fr}.ggrid{grid-template-columns:repeat(3,1fr)}.achs{grid-template-columns:repeat(3,1fr)}.shop{grid-template-columns:repeat(3,1fr)}}
@media (max-width:370px){.quick{grid-template-columns:repeat(4,1fr);gap:6px}.qb{font-size:11px}.nap-form{grid-template-columns:1fr}.cmp-r{grid-template-columns:48px 1fr 48px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* standalone site additions */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.setrow.col{flex-direction:column;align-items:stretch}
code.sel.big{font-size:19px;text-align:center;letter-spacing:.08em;padding:14px;font-weight:700}
.setup .link{align-self:center;padding:6px}

const Q={};
function W(path,op,data){const run=async()=>{const ref=db.doc(path);try{return op==='delete'?await ref.delete():await ref[op](data);}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,500+Math.random()*700));return op==='delete'?ref.delete():ref[op](data);}throw e;}};const p=(Q[path]||Promise.resolve()).catch(()=>{}).then(run);Q[path]=p;p.catch(onWriteErr);return p;}
function onWriteErr(e){console.warn('write',e);const c=e&&e.code;if(c==='invalid_argument'||c==='permission-denied')toast(L('ما قدرنا نحفظ — هذا الجهاز مش داخل الغرفة.','Could not save — this device is not in the room.'));else if(c==='quota_exceeded')toast(L('امتلأت مساحة التخزين. احذفوا بعض الذكريات أو الصور القديمة.','Storage is full. Delete some old memories or photos.'));else if(c==='resource_exhausted')toast(L('ضغط كبير، استنوا ثانية وجربوا.','Too many actions at once — wait a second and retry.'));else if(c!=='revoked')toast(L('الاتصال ضعيف، جرّب كمان مرة.','Connection is weak — try again.'));}

function stats(){const ids=[A(),B()].filter(Boolean);const st={};for(const u of ids)st[u]={xp:0,earned:0,coins:0,wins:0,played:0,streak:0,best:0,challenges:0,spent:0};
let coop=0,matches=0,together=0,perfect=0;const games=new Set();
const hist=S.history.slice().sort((a,b)=>a.ts-b.ts);
for(const h of hist){for(const u in (h.awards||{}))if(st[u]){st[u].xp+=+h.awards[u].xp||0;st[u].earned+=+h.awards[u].coins||0;}
 if(h.type==='match'){matches++;games.add(h.game);for(const u of ids){st[u].played++;if(h.winner===u){st[u].wins++;st[u].streak++;st[u].best=Math.max(st[u].best,st[u].streak);}else if(h.winner)st[u].streak=0;}}
 if(h.type==='coop'){coop++;games.add(h.game);for(const u of ids)st[u].played++;if(h.score&&h.score.m===h.score.t)perfect++;}
 if(h.type==='challenge'&&st[h.who])st[h.who].challenges++;
 if(h.type==='together'||(h.type==='day'&&h.together))together++;}
for(const p of S.purchases)if(st[p.by])st[p.by].spent+=+p.cost||0;
for(const u of ids){st[u].coins=st[u].earned-st[u].spent;st[u].level=Math.floor(Math.sqrt(st[u].xp/30))+1;const lo=30*(st[u].level-1)**2,hi=30*st[u].level**2;st[u].lvlPct=Math.round((st[u].xp-lo)/(hi-lo)*100);}
const memN=S.memories.length,wishDone=S.wishes.filter(w=>w.done).length,ch=ids.reduce((s,u)=>s+st[u].challenges,0);
const love=coop*6+matches*2+ch*4+memN*6+wishDone*8+together*5+S.history.filter(h=>h.type==='dq'||h.type==='dc').length*4;
return {st,coop,matches,together,perfect,games:games.size,love,loveLvl:Math.floor(love/100)+1,lovePct:love%100,memN,wishDone,ch};}

// ===== Sealed picks engine (commit–reveal) =====
const SEC={};
const SEALING=new Set();
function seal(slot,key,v){if(SEALING.has(slot+'|'+key))return;SEALING.add(slot+'|'+key);const salt=rnd(12);const lock=hash(key+'|'+JSON.stringify(v)+'|'+salt);SEC[slot]={key,v,salt};sfx('lock');
 W(`data/users/${ME}/${slot}`,'set',{key,v,salt});return W(`picks/${ME}/s/${slot}`,'set',{key,lock,reveal:null,at:Date.now()});}
const pk=(uid,slot,key)=>{const p=S.picks[uid]?.[slot];return p&&p.key===key?p:null;};
function rev(uid,slot,key){const p=pk(uid,slot,key);if(!p||!p.reveal)return null;const ok=hash(key+'|'+JSON.stringify(p.reveal.v)+'|'+p.reveal.salt)===p.lock;return {v:ok?p.reveal.v:null,ok,at:p.reveal.at||p.at};}
const revealing=new Set();
async function autoReveal(){if(!inWorld()||!PT())return;const mine=S.picks[ME]||{};for(const slot in mine){const p=mine[slot];if(!p||!p.lock||p.reveal)continue;const o=pk(PT(),slot,p.key);if(!o||!o.lock)continue;const tag=slot+'|'+p.key;if(revealing.has(tag))continue;revealing.add(tag);
 let sec=SEC[slot];if(!sec||sec.key!==p.key){try{const s=await db.doc(`data/users/${ME}/${slot}`).get();sec=s.exists?s.data():null;}catch(e){sec=null;}}
 if(!sec||sec.key!==p.key){revealing.delete(tag);continue;}
 W(`picks/${ME}/s/${slot}`,'set',{key:p.key,lock:p.lock,reveal:{v:sec.v,salt:sec.salt,at:Date.now()},at:p.at});}}
const resolving=new Set();
function resolveOnce(tag,fn){if(resolving.has(tag))return;resolving.add(tag);setTimeout(()=>{const g=S.game;const out=g?fn(clone(g)):null;if(out)commitGame(out);else resolving.delete(tag);},ME===A()?0:1500);}

const gname=t=>GAMES[t]?L(GAMES[t].ar,GAMES[t].en):(t==='deck'?L('تحدي','Challenge'):t);
function resWin(g,winner,score){const a=g.players.a,b=g.players.b;const aw={};if(winner){aw[winner]={xp:10,coins:5};aw[winner===a?b:a]={xp:3,coins:2};}else{aw[a]={xp:6,coins:3};aw[b]={xp:6,coins:3};}g.status='done';g.result={winner:winner||null,score:score||null,awards:aw};return g;}
function resCoop(g,m,t){const aw={};for(const u of [g.players.a,g.players.b])aw[u]={xp:4+m*2,coins:2+m};g.status='done';g.result={coop:true,score:{m,t},awards:aw};return g;}
function commitGame(g){g.rev=(g.rev||0)+1;g.upd=Date.now();S.game=g;
 if(g.status==='done'&&g.result){W(`history/${g.sid}`,'set',{type:g.result.coop?'coop':'match',game:g.type,sid:g.sid,winner:g.result.winner||null,score:g.result.score||null,awards:g.result.awards,ts:Date.now()});maybeCelebrate(g);}
 render();return W('games/current','set',g);}
function maybeCelebrate(g){if(g.status!=='done'||!g.result||!once('cel-'+g.sid))return;const w=g.result.winner;if(g.result.coop||w===ME)setTimeout(()=>celebrate(),350);else if(!w)setTimeout(()=>celebrate(true),350);else sfx('lose');}
function startGame(type,opts={},force){if(!both())return toast(L('لازم يدخل الطرف الثاني أول.','Your partner needs to join first.'));
 const cur=S.game;if(!force&&cur&&cur.status==='playing'&&Date.now()-(cur.upd||cur.startedAt)<3*36e5){return openModal('replace',{type,opts});}
 const def=GAMES[type];const sid=type+'-'+Date.now().toString(36)+rnd(4);const starter=opts.starter||ME;const mode=opts.mode??def.modes?.[def.defMode??0]?.v;
 const g={sid,type,status:'playing',by:ME,starter,startedAt:Date.now(),players:{a:A(),b:B()},mode:mode??null,state:def.init({sid,starter,mode,other:starter===A()?B():A()}),rev:0};
 closeModal();S.view='game';commitGame(g);sfx('ding');}
function act(m,ds){const g=S.game;if(!g||g.status!=='playing')return;const def=GAMES[g.type];if(def.act)def.act(clone(g),m,ds);}
function leaveGame(){const g=S.game;if(g&&g.status==='playing')openModal('leave');else go('games');}

function gHead(g,center=''){const a=g.players.a,b=g.players.b,def=GAMES[g.type];const sc=def.score?def.score(g):{};const turn=g.status==='playing'?g.state.turn:null;
 return `<div class="ghead"><button class="icon-btn" data-a="leave" aria-label="${L('رجوع','Back')}">${ico('back','flip')}</button><div class="gtitle"><span class="gico">${def.icon}</span>${esc(gname(g.type))}</div><div class="gmeta">${center}</div></div>
 <div class="vs">${pchip(a,sc[a],turn===a)}<span class="vs-x">${def.coop?ico('us'):'VS'}</span>${pchip(b,sc[b],turn===b)}</div>`;}
function pchip(uid,score,active){return `<div class="pchip ${active?'on':''}" style="--c:${col(uid)}">${av(uid,38)}<div class="pchip-t"><div class="pn">${esc(nm(uid))}${uid===ME?` <small>${L('(أنت)','(you)')}</small>`:''}</div><div class="ps num">${score??0}</div></div>${active?`<span class="turnpill">${L('دوره','turn')}</span>`:''}</div>`;}
function turnLine(g){const t=g.state.turn;return t===ME?`<p class="turnmsg me">${L('دورك!','Your turn!')}</p>`:`<p class="turnmsg">${L(`دور ${esc(nm(t))}…`,`${esc(nm(t))}'s turn…`)}</p>`;}
function waitLine(key,label){const his=pk(PT(),'g',key);return `<div class="waiting"><span class="lockd">${ico('lock')} ${label||L('اختيارك مقفول ومخفي','Your pick is locked and hidden')}</span><p>${his?L('الاثنين اختاروا… جاري الكشف','Both locked… revealing'):L(`بانتظار ${esc(nm(PT()))}…`,`Waiting for ${esc(nm(PT()))}…`)}</p></div>`;}
function partnerState(key){const his=pk(PT(),'g',key);return `<p class="pstate">${his?`${ico('check')} ${L(`${esc(nm(PT()))} اختار`,`${esc(nm(PT()))} has picked`)}`:`${ico('clock')} ${L(`${esc(nm(PT()))} لسا بفكر`,`${esc(nm(PT()))} is thinking`)}`}</p>`;}
function gDone(g){const r=g.result||{};let title;if(g.status==='abandoned')title=L('انتهت اللعبة بدون نتيجة','Game ended without a result');else if(r.coop)title=L(`توافقتوا في ${r.score.m} من ${r.score.t}`,`You matched ${r.score.m} of ${r.score.t}`);else if(!r.winner)title=L('تعادل!','A draw!');else title=r.winner===ME?L('فزت! 🎉','You won! 🎉'):L(`${nm(r.winner)} فاز`,`${nm(r.winner)} wins`);
 const aw=r.awards?.[ME];return `<div class="done"><div class="trophy">${g.status==='abandoned'?'🕊️':r.coop?'💞':r.winner===ME?'🏆':r.winner?'🎖️':'🤝'}</div><h2>${esc(title)}</h2>${aw?`<p class="aw">+${aw.xp} XP · +${aw.coins} ${ico('coin')}</p>`:''}<div class="row center"><button class="btn primary" data-a="rematch">${ico('spark')} ${L('إعادة التحدي','Rematch')}</button><button class="btn" data-a="go" data-v="games">${L('لعبة ثانية','Another game')}</button><button class="btn ghost" data-a="go" data-v="wheel">${L('لفّ الدولاب','Spin the wheel')}</button></div></div>`;}
function rematch(){const g=S.game;if(!g)return;const other=g.starter===g.players.a?g.players.b:g.players.a;startGame(g.type,{mode:g.mode,starter:other},true);}

// generic sealed-round helpers
const rkey=g=>g.sid+':'+g.state.round;
function sealedReady(g,slot='g',key=rkey(g)){const a=rev(g.players.a,slot,key),b=rev(g.players.b,slot,key);return a&&b?{a,b,key}:null;}

const GAMES={
rps:{icon:'✊',ar:'حجرة ورقة مقص',en:'Rock Paper Scissors',dAr:'اختيارات مخفية بتنكشف سوا',dEn:'Hidden picks revealed together',tag:'sealed',modes:[{v:1,ar:'جولة وحدة',en:'One round'},{v:3,ar:'أفضل من 3',en:'Best of 3'},{v:5,ar:'أفضل من 5',en:'Best of 5'}],defMode:1,
 init:({mode})=>({need:Math.ceil((mode||3)/2),round:1,rounds:{},wins:{}}),score:g=>g.state.wins,
 tick(g){const r=sealedReady(g);if(!r)return;resolveOnce(r.key,n=>{if(n.sid!==g.sid||n.state.round!==g.state.round||n.status!=='playing')return null;const s=n.state,a=n.players.a,b=n.players.b,va=r.a.v,vb=r.b.v;let w=null;if(va&&vb&&va!==vb)w=BEATS[va]===vb?a:b;else if(va&&!vb)w=a;else if(vb&&!va)w=b;
  s.rounds[s.round]={[a]:va,[b]:vb,w};if(w)s.wins[w]=(s.wins[w]||0)+1;if(w&&s.wins[w]>=s.need)return resWin(n,w,s.wins);if(s.round>=15){const wa=s.wins[a]||0,wb=s.wins[b]||0;return resWin(n,wa>wb?a:wb>wa?b:null,s.wins);}s.round++;return n;});},
 view(g){const s=g.state,key=rkey(g),mine=pk(ME,'g',key);const lastN=g.status==='playing'?s.round-1:Object.keys(s.rounds).length;const last=s.rounds[lastN];let reveal='';
  if(last){const anim=once(`rps-${g.sid}-${lastN}`)&&!RM();const me=last[ME],pt=last[PT()];const res=last.w?last.w===ME?L('ربحت الجولة','You won the round'):L(`${esc(nm(last.w))} ربح الجولة`,`${esc(nm(last.w))} won the round`):L('تعادل','Tie');

  let body='';if(g.status==='playing'){body=!mine?`<p class="prompt">${L(`الجولة ${s.round} — اختار حركتك`,`Round ${s.round} — make your move`)}</p><div class="rps-pick">${['r','p','s'].map(k=>`<button class="rps-btn" data-a="g" data-m="pick" data-v="${k}"><span>${RPS[k].e}</span><small>${L(RPS[k].ar,RPS[k].en)}</small></button>`).join('')}</div>${partnerState(key)}`:waitLine(key);}
  return gHead(g,L(`الفوز بـ ${s.need}`,`First to ${s.need}`))+reveal+body+(g.status!=='playing'?gDone(g):'');},
 act(g,m,ds){if(m==='pick'&&!pk(ME,'g',rkey(g))){seal('g',rkey(g),ds.v);sfx('tap');}}},

dice:{icon:'🎲',ar:'النرد',en:'Dice duel',dAr:'رمية بالدور، الأعلى بياخد الجولة',dEn:'Take turns — higher roll takes the round',tag:'turn',modes:[{v:3,ar:'3 جولات',en:'3 rounds'},{v:5,ar:'5 جولات',en:'5 rounds'}],defMode:1,
 init:({starter,mode})=>({round:1,total:mode||5,rolls:{},rw:{},turn:starter,first:starter,wins:{},last:null}),score:g=>g.state.wins,

  (g.status==='playing'?turnLine(g)+`<div class="row center"><button class="btn primary big" data-a="g" data-m="roll" ${g.state.turn!==ME?'disabled':''}>🎲 ${L('ارمِ النرد','Roll the dice')}</button></div>`:'')+
  `<table class="tbl"><thead><tr><th>#</th><th>${esc(nm(g.players.a))}</th><th>${esc(nm(g.players.b))}</th></tr></thead><tbody>${rows}</tbody></table>`+(g.status!=='playing'?gDone(g):'');},
 act(g,m){if(m!=='roll')return;const s=g.state;if(s.turn!==ME)return;const a=g.players.a,b=g.players.b,r=s.round;const d=[1+rint(6),1+rint(6)];s.rolls[r]=s.rolls[r]||{};if(s.rolls[r][ME])return;s.rolls[r][ME]=d;s.last={by:ME,d,n:(s.last?.n||0)+1};
  if(s.rolls[r][a]&&s.rolls[r][b]){const sa=s.rolls[r][a][0]+s.rolls[r][a][1],sb=s.rolls[r][b][0]+s.rolls[r][b][1];const w=sa>sb?a:sb>sa?b:null;s.rw[r]=w;if(w)s.wins[w]=(s.wins[w]||0)+1;
   if(r>=s.total){const wa=s.wins[a]||0,wb=s.wins[b]||0;setTimeout(()=>commitGame(resWin(g,wa>wb?a:wb>wa?b:null,s.wins)),0);return;}s.round++;s.first=s.first===a?b:a;s.turn=s.first;}else s.turn=ME===a?b:a;commitGame(g);}},

nap:{icon:'📝',ar:'اسم حيوان نبات جماد بلاد',en:'Name·Animal·Plant',dAr:'حرف عشوائي ومؤقت مشترك',dEn:'Random letter, shared timer',tag:'sealed',modes:[{v:60,ar:'60 ثانية',en:'60 sec'},{v:90,ar:'90 ثانية',en:'90 sec'},{v:120,ar:'دقيقتين',en:'2 min'}],defMode:1,
 init:({sid,mode})=>{const r=rng(sid);return {total:3,round:1,dur:mode||90,letters:shuffle(NAP_LETTERS,r).slice(0,3),phase:'write',start:Date.now()+3500,rounds:{},score:{}};},score:g=>g.state.score,
 tick(g){const s=g.state,key=rkey(g);if(s.phase==='write'){const r=sealedReady(g);if(!r)return;resolveOnce('w'+key,n=>{if(n.sid!==g.sid||n.state.round!==s.round||n.state.phase!=='write')return null;const blank=['','','','',''];n.state.rounds[s.round]={ans:{[n.players.a]:Array.isArray(r.a.v)?r.a.v:blank,[n.players.b]:Array.isArray(r.b.v)?r.b.v:blank}};n.state.phase='review';return n;});}
  else{const ra=pk(g.players.a,'rv',key),rb=pk(g.players.b,'rv',key);if(!ra?.done||!rb?.done)return;resolveOnce('r'+key,n=>{if(n.sid!==g.sid||n.state.round!==s.round||n.state.phase!=='review')return null;const st=n.state,a=n.players.a,b=n.players.b,R=st.rounds[st.round],L0=st.letters[st.round-1];

 view(g){const s=g.state,key=rkey(g),letter=s.letters[s.round-1];let body='';const head=gHead(g,L(`جولة ${s.round} من ${s.total}`,`Round ${s.round} of ${s.total}`));

  if(s.phase==='write'){const mine=pk(ME,'g',key);const end=s.start+s.dur*1000;const pre=Date.now()<s.start;
   body=`<div class="nap-top"><div class="nap-letter ${once('nl-'+key)?'pop':''}">${letter}</div><div class="nap-timer" data-start="${s.start}" data-end="${end}"><span class="num" data-t>${Math.max(0,Math.ceil((end-Date.now())/1000))}</span><small>${L('ثانية','sec')}</small></div></div>`;
   if(mine)body+=waitLine(key,L('إجاباتك مقفولة','Your answers are locked'));
   else body+=`<div class="nap-form ${pre?'pre':''}">${NAP_CATS.map((c,i)=>`<label class="fld"><span>${L(c.ar,c.en)}</span><input id="nap-${key}-${i}" data-d autocomplete="off" value="${esc(S.drafts[`nap-${key}-${i}`]||'')}" placeholder="${letter}…" ${pre?'disabled':''}></label>`).join('')}</div><div class="row center"><button class="btn primary" data-a="g" data-m="lock" ${pre?'disabled':''}>${ico('lock')} ${L('خلصت — اقفل إجاباتي','Done — lock my answers')}</button></div>${partnerState(key)}`;}
  else{const mineRv=pk(ME,'rv',key);const R=s.rounds[s.round];const fk='napf-'+key;const fl=S.drafts[fk]||[];
   body=`<p class="prompt">${L(`راجع إجابات ${esc(nm(PT()))} — اضغط على أي إجابة غلط لرفضها`,`Review ${esc(nm(PT()))}'s answers — tap any wrong one to reject it`)}</p>
   <div class="nap-review"><div class="nr-h"><span></span><span>${L('أنت','You')}</span><span>${esc(nm(PT()))}</span></div>${NAP_CATS.map((c,i)=>{const m=R.ans[ME][i]||'',h=R.ans[PT()][i]||'';const hv=napValid(h,letter);const flagged=(mineRv?mineRv.flags||[]:fl).includes(i);const hisRv=pk(PT(),'rv',key);const meFlag=hisRv?.flags?.includes(i);

   <p class="hint">${L('10 نقاط للإجابة الصحيحة، 5 إذا نفس إجابة الطرف الثاني، 0 للفارغة أو اللي ما بتبدأ بالحرف أو المرفوضة.','10 points per valid answer, 5 if identical to your partner, 0 if empty, wrong letter or rejected.')}</p>
   ${mineRv?`<div class="waiting"><p>${pk(PT(),'rv',key)?.done?L('جاري الحساب…','Scoring…'):L(`بانتظار مراجعة ${esc(nm(PT()))}…`,`Waiting for ${esc(nm(PT()))}'s review…`)}</p></div>`:`<div class="row center"><button class="btn primary" data-a="g" data-m="review">${ico('check')} ${L('تمّت المراجعة','Review done')}</button></div>`}`;
   if(s.round>1)body+=napTable(g,s.round-1);}
  return head+body;},

  if(m==='review'&&!pk(ME,'rv',key)){W(`picks/${ME}/s/rv`,'set',{key,flags:S.drafts['napf-'+key]||[],done:true,at:Date.now()});sfx('lock');}}},

xo:{icon:'❌',ar:'إكس أو',en:'Tic-Tac-Toe',dAr:'الكلاسيكية، بلمسة ناعمة',dEn:'The classic, softly animated',tag:'turn',

 act(g,m,ds){const s=g.state,i=+ds.i;if(m!=='put'||s.turn!==ME||s.board[i])return;s.board[i]=ME;sfx('tap');const L3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const w=L3.find(l=>l.every(k=>s.board[k]===ME));

function memResolve(n){const s=n.state;const [x,y]=s.open;if(s.deck[x]===s.deck[y]){s.matched[x]=s.turn;s.matched[y]=s.turn;s.pairs[s.turn]=(s.pairs[s.turn]||0)+1;s.open=[];if(Object.keys(s.matched).length===s.deck.length){const a=n.players.a,b=n.players.b,pa=s.pairs[a]||0,pb=s.pairs[b]||0;return resWin(n,pa>pb?a:pb>pa?b:null,s.pairs);}}else{s.open=[];s.turn=s.turn===n.players.a?n.players.b:n.players.a;}return n;}
function napNorm(t){return String(t||'').trim().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');}
function napValid(t,letter){const n=napNorm(t);if(n.length<2)return false;const l=napNorm(letter);return n.startsWith(l)||(n.startsWith('ال')&&n.slice(2).startsWith(l));}
function napTable(g,r){const R=g.state.rounds[r];if(!R||!R.det)return '';const a=g.players.a,b=g.players.b;return `<details class="log" ${g.status!=='playing'&&r===g.state.total?'open':''}><summary>${L(`نتيجة الجولة ${r}`,`Round ${r} result`)} — ${g.state.letters[r-1]} · ${esc(nm(a))} ${R.pts[a]} · ${esc(nm(b))} ${R.pts[b]}</summary><table class="tbl"><thead><tr><th></th><th>${esc(nm(a))}</th><th>${esc(nm(b))}</th></tr></thead><tbody>${NAP_CATS.map((c,i)=>`<tr><td>${L(c.ar,c.en)}</td><td>${esc(R.ans[a][i])||'—'} <b class="pt">${R.det[a][i]}</b></td><td>${esc(R.ans[b][i])||'—'} <b class="pt">${R.det[b][i]}</b></td></tr>`).join('')}</tbody></table></details>`;}
function kmbLog(g){const s=g.state;const rs=Object.keys(s.rounds).filter(r=>s.rounds[r].pts!=null);if(!rs.length)return '';return `<details class="log"><summary>${L('الأسئلة السابقة','Previous questions')} (${rs.length})</summary>${rs.map(r=>{const R=s.rounds[r];return `<div class="logrow"><span>${esc(KMB_Q[s.qs[r-1]])}</span><span>${esc(nm(R.sub))}: <b>${esc(R.ans)}</b> · ${L('تخمين','guess')}: <b>${esc(R.guess)}</b> <b class="pt">+${R.pts}</b></span></div>`;}).join('')}</details>`;}
function trivLast(g,r){const R=g.state.rounds[r];if(!R)return '';const T=TRIVIA[g.state.qs[r-1]];const ord=GAMES.triv.order(g,r);const line=u=>{const v=R[u];const ok=v&&v.c>=0&&ord[v.c]===0;return `${esc(nm(u))}: ${v&&v.c>=0?esc(T.o[ord[v.c]]):L('ما جاوب','no answer')} ${ok?'✅':'❌'} ${v&&v.c>=0?`<small class="num">${(v.ms/1000).toFixed(1)}s</small>`:''} <b class="pt">+${R.pts[u]}</b>`;};
 return `<div class="lastres ${once('tq-'+g.sid+r)?'anim':''}"><div>${L('الجواب الصحيح','Correct answer')}: <b>${esc(T.o[0])}</b></div><div>${line(g.players.a)}</div><div>${line(g.players.b)}</div></div>`;}

// dice cube
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const FACE_ROT={1:'rotateX(0deg) rotateY(0deg)',6:'rotateY(180deg)',3:'rotateY(-90deg)',4:'rotateY(90deg)',2:'rotateX(-90deg)',5:'rotateX(90deg)'};
function face(v,cls){return `<div class="face ${cls}">${Array.from({length:9},(_,i)=>`<i class="${PIPS[v].includes(i+1)?'pip':''}"></i>`).join('')}</div>`;}
function die(v,anim,delay){return `<div class="die-wrap"><div class="tumble ${anim&&!RM()?'roll':''}" style="animation-delay:${delay?80:0}ms"><div class="cube" style="transform:rotateX(-14deg) rotateY(18deg) ${FACE_ROT[v]}">${face(1,'f1')}${face(6,'f6')}${face(3,'f3')}${face(4,'f4')}${face(2,'f2')}${face(5,'f5')}</div></div></div>`;}

// ===== Wheel =====
function wheelItems(tab){const m=S.meta||{};if(tab==='games'){const ex=m.wheelExclude||[];const items=Object.keys(GAMES).filter(k=>!ex.includes(k)).map(k=>({k,label:L(GAMES[k].ar,GAMES[k].en),ic:GAMES[k].icon}));if(!ex.includes('deck'))items.push({k:'deck',label:L('تحدي عشوائي','Random challenge'),ic:'🔥'});for(const c of (m.wheelCustom||[]))items.push({k:'custom',label:c,ic:'✨'});return items;}

 return allRewards().map(r=>({k:'rw:'+r.id,label:r.title,ic:r.ic||'🎁'}));}
function drawWheel(items){const cv=$('#wheelCv');if(!cv)return;const dpr=devicePixelRatio||1;const size=cv.clientWidth||300;cv.width=size*dpr;cv.height=size*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const cs=getComputedStyle(document.documentElement);const pal=['--w1','--w2','--w3','--w4'].map(v=>cs.getPropertyValue(v).trim());const ink=cs.getPropertyValue('--ink').trim(),sur=cs.getPropertyValue('--surface').trim();
 const n=Math.max(items.length,1),R=size/2,seg=Math.PI*2/n;x.clearRect(0,0,size,size);
 for(let i=0;i<n;i++){const a0=-Math.PI/2+i*seg;x.beginPath();x.moveTo(R,R);x.arc(R,R,R-4,a0,a0+seg);x.closePath();x.fillStyle=pal[i%pal.length]||'#eee';x.fill();x.strokeStyle=sur;x.lineWidth=2;x.stroke();
  const it=items[i];if(!it)continue;x.save();x.translate(R,R);x.rotate(a0+seg/2);x.textAlign='right';x.textBaseline='middle';x.fillStyle=ink;const fs=Math.max(10,Math.min(15,size/22));x.font=`600 ${fs}px "Readex Pro", system-ui, sans-serif`;let t=it.label;const maxW=R*.58;while(x.measureText(t).width>maxW&&t.length>3)t=t.slice(0,-2)+'…';x.direction='rtl';x.fillText(it.ic+' '+t,R-14,0);x.restore();}

function spin(){if(S.spinning)return;const tab=S.wheelTab;const items=wheelItems(tab);if(items.length<2)return toast(L('لازم يكون في خيارين عالأقل.','The wheel needs at least two options.'));

function compress(file,max,q,square){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=m;}const s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}

chat:()=>{S.chatOpen=true;closeModal();renderSheet();setTimeout(()=>$('#chatIn')?.focus(),50);},closeChat:()=>{S.chatOpen=false;renderSheet();},react:(d)=>react(d.v),
call:()=>openModal('call'),callOpened:(d)=>{sendChat(d.v==='video'?L('📹 فتحت مكالمة فيديو — تعال!','📹 I opened a video call — join me!'):L('📞 فتحت مكالمة صوت — تعال!','📞 I opened a voice call — join me!'));},
settings:()=>{S.drafts.pfColor=P(ME).color;S.drafts.pfAvatar=null;S.drafts['pf-name']=null;openModal('settings');},closeModal:()=>closeModal(),
lang:(d)=>{S.lang=d.v;LS.set('lang',d.v);applyLang();render();renderModal();S.chatOpen&&($('#sheet').innerHTML='',renderSheet());},theme:(d)=>{S.theme=d.v;LS.set('theme',d.v);applyTheme();renderModal();if(S.view==='wheel')render();},sound:()=>{S.sound=!S.sound;LS.set('sound',S.sound);renderModal();},
savePin:()=>{const p=(S.drafts['pin-new']||'').trim();OLWFB.setPin(ROOM,p?hash('olw|'+p):'').catch(onWriteErr);S.drafts['pin-new']='';toast(p?L('تم تغيير الرمز','Code updated'):L('تم إلغاء الرمز','Code removed'));renderModal();},
copy:(d)=>{navigator.clipboard?.writeText(d.v).then(()=>toast(L('تم النسخ','Copied')),()=>toast(L('انسخ الرابط من المربع تحت','Copy the link from the box below')));},
confirmYes:()=>{const f=S.modal?.data?.fn;closeModal();f&&f();}};
function confirmDo(title,body,yes,fn,danger){openModal('confirm',{title,body,yes,fn,danger});}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a;if(!ACT[a])return;if(el.tagName!=='A')e.preventDefault();if(a!=='g')sfx('tap');ACT[a](el.dataset,el);});
document.addEventListener('input',e=>{const t=e.target;if(t.id&&t.hasAttribute('data-d'))S.drafts[t.id]=t.value;});
document.addEventListener('change',async e=>{const t=e.target;if(t.id&&t.hasAttribute('data-d'))S.drafts[t.id]=t.value;
 if(t.id==='pf-file'&&t.files[0]){try{S.drafts.pfAvatar=await compress(t.files[0],192,.82,true);render();renderModal();}catch(er){toast(L('ما قدرنا نقرأ الصورة.','Could not read that image.'));}}
 if(t.id==='mm-file'&&t.files[0]){try{let d=await compress(t.files[0],1100,.74);if(d.length>230000)d=await compress(t.files[0],800,.6);S.drafts.mmPhoto=d;render();}catch(er){toast(L('ما قدرنا نقرأ الصورة.','Could not read that image.'));}}});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const i=$('#chatIn');sendChat(i.value);i.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal)closeModal();else if(S.chatOpen){S.chatOpen=false;renderSheet();}}if(e.key==='Enter'&&e.target.id==='dq-in')ACT.dqSend();if(e.key==='Enter'&&e.target.id==='ws-in')ACT.addWish();});

// timers: countdowns, auto-lock on timeout, stuck-turn recovery
setInterval(()=>{const now=Date.now();document.querySelectorAll('[data-end]').forEach(el=>{const st=+el.dataset.start,en=+el.dataset.end;const t=el.querySelector('[data-t]');const pre=now<st;const left=Math.max(0,Math.ceil(((pre?st:en)-now)/1000));if(t)t.textContent=pre?'…'+left:left;el.classList.toggle('low',!pre&&left<=10);el.style.setProperty('--p',pre?1:Math.max(0,(en-now)/(en-st)));});
 const g=S.game;if(g&&g.status==='playing'&&inWorld()){const key=rkey(g);
  if(g.type==='nap'&&g.state.phase==='write'&&!pk(ME,'g',key)){if(now>g.state.start+g.state.dur*1000)seal('g',key,NAP_CATS.map((_,i)=>(S.drafts[`nap-${key}-${i}`]||'').trim().slice(0,40)));else if(now>=g.state.start&&document.querySelector('.nap-form.pre'))render();}
  if(g.type==='triv'&&!pk(ME,'g',key)){if(now>g.state.qStart+g.state.lim*1000)seal('g',key,{c:-1,ms:g.state.lim*1000});else if(now>=g.state.qStart&&document.querySelector('.opt[disabled]'))render();}
  if(g.type==='mem')GAMES.mem.tick(g);}},500);

// ===== Boot =====
function setupRoom(){try{room.presence({uid:ME}).catch(()=>{});room.onPeers(ch=>{S.online=new Set(ch.peers.filter(p=>!p.isMe).map(p=>p.presence?.uid).filter(Boolean));renderChrome();},()=>{});room.on('react',m=>{if(!m.isMe&&!m.sameTab&&m.data?.e)floatEmoji(String(m.data.e).slice(0,4));},()=>{});}catch(e){}}
function sub(ref,fn){return ref.onSnapshot(fn,e=>{console.warn('sub',e);if(e&&e.code==='revoked'){S.err='revoked';render();}});}
const colArr=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
const pickSubs={};
function onMeta(){for(const uid of [A(),B()])if(uid&&!pickSubs[uid])pickSubs[uid]=sub(db.collection(`picks/${uid}/s`),s=>{const o={};for(const d of s.docs)o[d.id]=d.data();S.picks[uid]=o;autoReveal();onHistory();tick();render();});
 const m=S.meta;if(!m||!m.seats?.a){if(!['welcome','setup'].includes(S.view)){S.view='welcome';}}else if(inWorld()){if(['boot','welcome','setup','full'].includes(S.view))S.view='home';}else if(!m.seats.b){if(!['welcome','setup'].includes(S.view))S.view='welcome';}else S.view='full';
 dailyCheckin();}
function tick(){const g=S.game;if(!g||g.status!=='playing'||!inWorld())return;const d=GAMES[g.type];if(d&&d.tick)d.tick(g);}
function onGame(prev){const g=S.game;if(g&&g.status==='playing'&&(!prev||prev.sid!==g.sid)&&g.by!==ME&&inWorld()&&Date.now()-g.startedAt<60000){sfx('ding');if(!['game','setup'].includes(S.view)){S.view='game';toast(L(`${nm(g.by)} بدأ ${gname(g.type)}`,`${nm(g.by)} started ${gname(g.type)}`));}}
 if(g&&g.status==='done'&&prev&&prev.sid===g.sid&&prev.status==='playing')maybeCelebrate(g);if(g&&g.type==='dice'&&g.state.last&&prev&&prev.sid===g.sid&&prev.state?.last?.n!==g.state.last.n&&g.state.last.by!==ME)sfx('roll');
 if(g&&prev&&prev.sid===g.sid&&g.status==='playing'&&g.state.turn===ME&&prev.state?.turn!==ME)sfx('ding');tick();render();}
function enterRoom(r,seat){ROOM=r;ME=seat;S.inviteRoom=null;LS.set('room',{id:r,seat});try{if(!location.hash.includes(r))history.replaceState(null,'','#r='+r);}catch(e){}db=OLWFB.makeDb(r,seat);subscribeAll();}
function heartbeat(){if(db&&ME&&document.visibilityState==='visible')W(`presence/${ME}`,'set',{at:Date.now()}).catch(()=>{});}
let subscribed=false;
function subscribeAll(){if(subscribed)return;subscribed=true;
 sub(db.doc('world/meta'),s=>{S.meta=s.exists?s.data():null;if(!s.metadata.fromCache||S.meta){S.metaLoaded=true;S.stale=false;}onMeta();render();});
 sub(db.collection('players'),s=>{const o={};for(const x of s.docs)o[x.id]=x.data();S.players=o;render();renderSheet();});
 sub(db.doc('games/current'),s=>{const prev=S.game;S.game=s.exists?s.data():null;onGame(prev);});
 sub(db.collection('history').orderBy('ts','desc').limit(1000),s=>{S.history=colArr(s);onHistory();render();});
 sub(db.collection('purchases').orderBy('ts','desc').limit(400),s=>{S.purchases=colArr(s);render();});
 sub(db.collection('chat').orderBy('ts','desc').limit(80),s=>{S.chat=colArr(s).reverse();onChat(s);});
 sub(db.collection('cards'),s=>{S.cards=colArr(s);render();});
 sub(db.collection('rewards'),s=>{S.rewards=colArr(s);render();});
 sub(db.collection('memories').orderBy('date','desc').limit(200),s=>{S.memories=colArr(s);render();});
 sub(db.collection('wishes').orderBy('ts','desc').limit(300),s=>{S.wishes=colArr(s);render();});
 sub(db.doc('deck/current'),s=>{const prev=S.deck;S.deck=s.exists?s.data():null;if(S.deck&&prev&&S.deck.at!==prev.at&&S.deck.by!==ME){sfx('pop');if(S.view!=='deck')toast(L(`${nm(S.deck.by)} سحب بطاقة`,`${nm(S.deck.by)} drew a card`),`<button class="tbtn" data-a="go" data-v="deck">${L('شوف','View')}</button>`);}render();});
 sub(db.doc('wheel/current'),s=>{const prev=S.wheel;S.wheel=s.exists?s.data():null;onWheel(prev);});
 sub(db.collection('presence'),s=>{const now=Date.now();S.online=new Set(s.docs.filter(d=>d.id!==ME&&now-(d.data().at||0)<150000).map(d=>d.id));renderChrome();});
 heartbeat();setInterval(heartbeat,60000);document.addEventListener('visibilitychange',heartbeat);
 setTimeout(()=>{if(!S.metaLoaded){S.stale=true;render();}},10000);}
async function boot(){applyTheme();applyLang();render();
 if(!window.OLWFB||!FB_CONFIG||!FB_CONFIG.apiKey){S.view='nohost';S.metaLoaded=true;render();return;}
 try{await OLWFB.init(FB_CONFIG);}catch(e){console.warn(e);S.view='offline';S.metaLoaded=true;render();return;}
 const hr=roomFromHash();const saved=LS.get('room',null);
 if(hr){const seat=await OLWFB.mySeat(hr);if(seat)return enterRoom(hr,seat);
  if(saved&&saved.id&&saved.id!==hr){const s2=await OLWFB.mySeat(saved.id);if(s2)return enterRoom(saved.id,s2);}
  ROOM=hr;S.inviteRoom=hr;S.view='setup';S.p={mode:'join'};S.drafts.pfColor=COLORS[1];S.metaLoaded=true;render();return;}
 if(saved&&saved.id){const seat=await OLWFB.mySeat(saved.id);if(seat)return enterRoom(saved.id,seat);ROOM=saved.id;}
 S.view='welcome';S.metaLoaded=true;render();}
window.addEventListener('hashchange',()=>{const hr=roomFromHash();if(hr&&hr!==ROOM)location.reload();});
addEventListener('resize',()=>{if(S.view==='wheel'&&!S.spinning)render();});
boot();

</script>
